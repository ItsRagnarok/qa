<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QA Voice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#FBFAF6;
  --border:#DEDBD1; --border-strong:#C7C3B6;
  --ink:#1E2420; --ink-soft:#5B655F; --ink-faint:#8B948C;
  --accent:#2F6B58; --accent-ink:#FFFFFF; --accent-soft:#E1EEE7;
  --danger:#A8402A; --danger-soft:#F6DFD8;
  --ok:#2F6B58; --ok-soft:#E1EEE7;
  --fixed-c:#2A5EA6; --fixed-soft:#DEEAF8;
  --shadow:0 1px 2px rgba(30,36,32,.06),0 6px 18px rgba(30,36,32,.07);
  --font-display:'Archivo','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#171E1B; --surface-2:#1D2521;
  --border:#2B3531; --border-strong:#3A4642;
  --ink:#E7ECE8; --ink-soft:#A3ADA6; --ink-faint:#6E7873;
  --accent:#6FC8A8; --accent-ink:#0B1512; --accent-soft:#1D362E;
  --danger:#E38468; --danger-soft:#3A211A;
  --ok:#6FC8A8; --ok-soft:#1D362E;
  --fixed-c:#6C9DE4; --fixed-soft:#1B2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1B; --surface-2:#1D2521;
  --border:#2B3531; --border-strong:#3A4642;
  --ink:#E7ECE8; --ink-soft:#A3ADA6; --ink-faint:#6E7873;
  --accent:#6FC8A8; --accent-ink:#0B1512; --accent-soft:#1D362E;
  --danger:#E38468; --danger-soft:#3A211A;
  --ok:#6FC8A8; --ok-soft:#1D362E;
  --fixed-c:#6C9DE4; --fixed-soft:#1B2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
@media(max-width:720px){input,textarea,select{font-size:16px!important}}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(80px + env(safe-area-inset-bottom))}

.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:22px;overflow:auto}
.gate-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:392px;box-shadow:var(--shadow)}
.gate-card h2{font-size:20px;margin-bottom:5px}
.gate-sub{margin:0 0 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.gate-card label{display:block;font-size:12.5px;color:var(--ink-soft);margin:13px 0 5px}
.gate-card input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);min-height:46px}
.gate-msg{margin:13px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.45;min-height:19px}
.gate-msg.bad{color:var(--danger)}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:0 18px;min-height:46px;font-weight:700;font-size:15px;cursor:pointer}
.btn.wide{width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border-strong)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 14px;border-bottom:1px solid var(--border)}
.top .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 3px}
.top .eyebrow a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink-faint)}
.top h1{font-size:23px;letter-spacing:-.01em}
.top-right{display:flex;align-items:center;gap:9px}
.who{font-size:12.5px;color:var(--ink-soft)}

.projbar{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.projbar::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{font-family:var(--font-mono);font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}

.empty{margin-top:60px;text-align:center;color:var(--ink-faint);font-size:14px}

.newproj{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.newproj input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);min-height:46px;margin-top:8px}
.newproj .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.pcard{margin:16px 0 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px;background:var(--accent-soft);border-bottom:1px solid var(--border);flex-wrap:wrap}
.phead h2{font-size:19px}
.phead .purl{font-size:12.5px;color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere}
.pactions{display:flex;gap:8px;flex-wrap:wrap}

.mic-row{padding:16px;border-bottom:1px solid var(--border)}
.mic-box{display:flex;gap:10px;align-items:flex-start}
.mic-btn{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface-2);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center}
.mic-btn.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,64,42,.35)}50%{box-shadow:0 0 0 10px rgba(168,64,42,0)}}
.mic-text{flex:1;min-width:0}
.mic-text textarea{width:100%;min-height:70px;padding:11px 12px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);resize:vertical}
.mic-hint{font-size:12px;color:var(--ink-faint);margin-top:6px}
.mic-status{display:inline-flex;gap:8px;flex-wrap:wrap}
.status-pick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.spick{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-soft);border-radius:8px;padding:0 12px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.spick.bug.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.spick.fixed.on{background:var(--fixed-soft);border-color:var(--fixed-c);color:var(--fixed-c)}
.spick.ok.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mic-add{margin-top:10px;display:flex;justify-content:flex-end}

.findings{padding:6px 16px 16px}
.finding{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.finding:last-child{border-bottom:0}
.pill{flex:none;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:4px 8px;margin-top:1px}
.pill.bug{background:var(--danger-soft);color:var(--danger)}
.pill.fixed{background:var(--fixed-soft);color:var(--fixed-c)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.ftext{flex:1;min-width:0;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.fdel{flex:none;background:none;border:0;color:var(--ink-faint);cursor:pointer;min-width:36px;min-height:36px;font-size:17px}
.fdel:hover{color:var(--danger)}
.fempty{padding:24px 0;text-align:center;color:var(--ink-faint);font-size:13.5px}

.sharebox{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.sharebox .sl{font-size:13px;color:var(--ink-soft)}
.sharebox code{font-family:var(--font-mono);font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere}

.status-line{position:fixed;left:0;right:0;bottom:0;padding:9px 16px calc(9px + env(safe-area-inset-bottom));font-size:12px;color:var(--ink-faint);text-align:center;background:var(--bg);border-top:1px solid var(--border)}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gate-card">
    <h2>QA Voice Board</h2>
    <p class="gate-sub">Aceleași date ca la celelalte aplicații.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Parolă</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn wide" type="submit">Intră</button>
      <p id="loginMsg" class="gate-msg"></p>
    </form>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <div>
      <p class="eyebrow"><a href="/">← Aplicații</a></p>
      <h1>QA Voice Board</h1>
    </div>
    <div class="top-right">
      <span id="who" class="who"></span>
      <button id="logout" class="btn ghost small" type="button">Ieși</button>
    </div>
  </div>

  <div id="projbar" class="projbar"></div>

  <div id="newProjectBtn" class="row" style="margin-top:14px">
    <button id="showNewProj" class="btn ghost small" type="button">+ Proiect nou</button>
  </div>

  <div id="newProj" class="newproj" hidden>
    <label for="npName" style="font-size:12.5px;color:var(--ink-soft)">Nume proiect / client</label>
    <input id="npName" placeholder="ex: Site Client X">
    <label for="npUrl" style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;display:block">Link testat (opțional)</label>
    <input id="npUrl" placeholder="https://…">
    <div class="row">
      <button id="npCreate" class="btn small" type="button">Creează</button>
      <button id="npCancel" class="btn ghost small" type="button">Anulează</button>
    </div>
  </div>

  <div id="emptyState" class="empty" hidden>Niciun proiect încă. Adaugă unul ca să începi să dictezi observații.</div>

  <div id="pcard" class="pcard" hidden></div>
</div>

<p id="statusLine" class="status-line" hidden></p>

<script>
function $(id) { return document.getElementById(id); }

async function api(path, opts) {
  var r = await fetch(path, Object.assign({ credentials: "same-origin" }, opts));
  var data = await r.json().catch(function () { return {}; });
  return { status: r.status, data: data };
}

function setStatus(m) {
  var s = $("statusLine");
  s.textContent = m || "";
  s.hidden = !m;
  if (m) setTimeout(function () { if (s.textContent === m) s.hidden = true; }, 2400);
}

var projects = [];
var activeId = null;
var activeProject = null;
var activeFindings = [];
var pendingStatus = "bug";
var recognizing = false;
var recognizer = null;

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function renderProjbar() {
  var host = $("projbar");
  host.textContent = "";
  projects.forEach(function (p) {
    var c = document.createElement("button");
    c.type = "button";
    c.className = "chip" + (p.id === activeId ? " on" : "");
    var open = (p.counts.bug || 0);
    c.innerHTML = esc(p.name) + (open ? ' <span class="n">' + open + '</span>' : "");
    if (p.status === "closed") c.style.opacity = ".55";
    c.addEventListener("click", function () { selectProject(p.id); });
    host.appendChild(c);
  });
}

async function loadProjects(selectFirst) {
  var r = await api("/api/qa?action=list");
  if (r.status !== 200) { setStatus(r.data.message || "Nu am putut încărca proiectele."); return; }
  projects = r.data.projects || [];
  renderProjbar();
  $("emptyState").hidden = projects.length !== 0;
  if (!projects.length) { $("pcard").hidden = true; activeId = null; return; }
  if (selectFirst && !activeId) selectProject(projects[0].id);
}

async function selectProject(id) {
  activeId = id;
  renderProjbar();
  var r = await api("/api/qa?action=project&id=" + encodeURIComponent(id));
  if (r.status !== 200) { setStatus(r.data.message || "Nu am putut deschide proiectul."); return; }
  activeProject = r.data.project;
  activeFindings = r.data.findings || [];
  renderProject();
}

function statusLabel(s) { return s === "fixed" ? "Rezolvat" : s === "ok" ? "Merge" : "Nu merge"; }

function renderProject() {
  var host = $("pcard");
  host.hidden = false;
  host.textContent = "";

  var head = document.createElement("div");
  head.className = "phead";
  var left = document.createElement("div");
  left.innerHTML = "<h2>" + esc(activeProject.name) + "</h2>" +
    (activeProject.url ? '<div class="purl">' + esc(activeProject.url) + "</div>" : "");
  var actions = document.createElement("div");
  actions.className = "pactions";

  var closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "btn ghost small";
  closeBtn.textContent = activeProject.status === "closed" ? "Redeschide" : "Închide";
  closeBtn.addEventListener("click", async function () {
    var next = activeProject.status === "closed" ? "open" : "closed";
    await api("/api/qa?action=close-project", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: activeProject.id, status: next }) });
    activeProject.status = next;
    await loadProjects(false);
    renderProject();
  });

  var delBtn = document.createElement("button");
  delBtn.type = "button";
  delBtn.className = "btn ghost small";
  delBtn.textContent = "Șterge";
  delBtn.addEventListener("click", async function () {
    if (!confirm("Ștergi proiectul „" + activeProject.name + "” și toate observațiile lui?")) return;
    await api("/api/qa?action=delete-project", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: activeProject.id }) });
    activeId = null; activeProject = null;
    await loadProjects(true);
  });

  actions.appendChild(closeBtn);
  actions.appendChild(delBtn);
  head.appendChild(left);
  head.appendChild(actions);
  host.appendChild(head);

  host.appendChild(buildMicRow());
  host.appendChild(buildFindings());
  host.appendChild(buildShareBox());
}

function buildMicRow() {
  var wrap = document.createElement("div");
  wrap.className = "mic-row";

  var box = document.createElement("div");
  box.className = "mic-box";

  var mic = document.createElement("button");
  mic.type = "button";
  mic.className = "mic-btn";
  mic.setAttribute("aria-label", "Dictează");
  mic.textContent = "🎙️";

  var textWrap = document.createElement("div");
  textWrap.className = "mic-text";
  var ta = document.createElement("textarea");
  ta.id = "dictateText";
  ta.placeholder = "Apasă microfonul și vorbește, sau scrie direct ce ai observat…";

  var hint = document.createElement("div");
  hint.className = "mic-hint";
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  hint.textContent = SR ? "Apasă din nou microfonul ca să oprești dictarea." : "Dictarea vocală nu e susținută de acest browser — poți scrie direct.";
  if (!SR) mic.disabled = true;

  textWrap.appendChild(ta);
  textWrap.appendChild(hint);
  box.appendChild(mic);
  box.appendChild(textWrap);
  wrap.appendChild(box);

  var picks = document.createElement("div");
  picks.className = "status-pick";
  [["bug", "Nu merge"], ["fixed", "Rezolvat"], ["ok", "Merge"]].forEach(function (pair) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "spick " + pair[0] + (pendingStatus === pair[0] ? " on" : "");
    b.textContent = pair[1];
    b.addEventListener("click", function () {
      pendingStatus = pair[0];
      picks.querySelectorAll(".spick").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
    });
    picks.appendChild(b);
  });
  wrap.appendChild(picks);

  var addRow = document.createElement("div");
  addRow.className = "mic-add";
  var addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "btn small";
  addBtn.textContent = "Adaugă observația";
  addBtn.addEventListener("click", async function () {
    var text = ta.value.trim();
    if (!text) return;
    addBtn.disabled = true;
    var r = await api("/api/qa?action=add-finding", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ project_id: activeProject.id, text: text, status: pendingStatus }),
    });
    addBtn.disabled = false;
    if (r.status !== 200) { setStatus(r.data.message || "Nu am putut salva."); return; }
    ta.value = "";
    activeFindings.push(r.data.finding);
    renderFindingsInto($("findingsHost"));
    await loadProjects(false);
    setStatus("Salvat.");
  });
  addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  mic.addEventListener("click", function () {
    if (!SR) return;
    if (recognizing) { recognizer && recognizer.stop(); return; }
    recognizer = new SR();
    recognizer.lang = "ro-RO";
    recognizer.continuous = true;
    recognizer.interimResults = true;
    var baseText = ta.value ? ta.value.replace(/\s+$/, "") + " " : "";
    recognizer.onresult = function (ev) {
      var finalChunk = "", interim = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var chunk = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalChunk += chunk + " "; else interim += chunk;
      }
      if (finalChunk) { baseText = (baseText + finalChunk).replace(/\s+$/, "") + " "; }
      ta.value = baseText + interim;
    };
    recognizer.onerror = function () { recognizing = false; mic.classList.remove("on"); };
    recognizer.onend = function () { recognizing = false; mic.classList.remove("on"); };
    recognizer.start();
    recognizing = true;
    mic.classList.add("on");
  });

  return wrap;
}

function buildFindings() {
  var host = document.createElement("div");
  host.className = "findings";
  host.id = "findingsHost";
  renderFindingsInto(host);
  return host;
}

function renderFindingsInto(host) {
  host.textContent = "";
  if (!activeFindings.length) {
    var e = document.createElement("div");
    e.className = "fempty";
    e.textContent = "Nicio observație încă.";
    host.appendChild(e);
    return;
  }
  activeFindings.slice().reverse().forEach(function (f) {
    var row = document.createElement("div");
    row.className = "finding";
    var pill = document.createElement("span");
    pill.className = "pill " + f.status;
    pill.textContent = statusLabel(f.status);
    var text = document.createElement("div");
    text.className = "ftext";
    text.textContent = f.text;
    var del = document.createElement("button");
    del.type = "button";
    del.className = "fdel";
    del.setAttribute("aria-label", "Șterge observația");
    del.textContent = "×";
    del.addEventListener("click", async function () {
      await api("/api/qa?action=delete-finding", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: f.id }) });
      activeFindings = activeFindings.filter(function (x) { return x.id !== f.id; });
      renderFindingsInto(host);
      await loadProjects(false);
    });
    pill.addEventListener("click", async function () {
      var order = ["bug", "fixed", "ok"];
      var next = order[(order.indexOf(f.status) + 1) % order.length];
      f.status = next;
      pill.className = "pill " + next;
      pill.textContent = statusLabel(next);
      await api("/api/qa?action=update-finding", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: f.id, status: next }) });
      await loadProjects(false);
    });
    pill.style.cursor = "pointer";
    pill.title = "Apasă ca să schimbi starea";
    row.appendChild(pill);
    row.appendChild(text);
    row.appendChild(del);
    host.appendChild(row);
  });
}

function buildShareBox() {
  var wrap = document.createElement("div");
  wrap.className = "sharebox";
  var link = location.origin + "/raport.html?p=" + encodeURIComponent(activeProject.slug);
  var lbl = document.createElement("span");
  lbl.className = "sl";
  lbl.textContent = "Link pentru client:";
  var code = document.createElement("code");
  code.textContent = link;
  var copy = document.createElement("button");
  copy.type = "button";
  copy.className = "btn ghost small";
  copy.textContent = "Copiază";
  copy.addEventListener("click", function () {
    navigator.clipboard && navigator.clipboard.writeText(link).then(function () { setStatus("Link copiat."); });
  });
  wrap.appendChild(lbl);
  wrap.appendChild(code);
  wrap.appendChild(copy);
  return wrap;
}

$("showNewProj").addEventListener("click", function () {
  $("newProj").hidden = false;
  $("newProjectBtn").hidden = true;
  $("npName").focus();
});
$("npCancel").addEventListener("click", function () {
  $("newProj").hidden = true;
  $("newProjectBtn").hidden = false;
});
$("npCreate").addEventListener("click", async function () {
  var name = $("npName").value.trim();
  if (!name) { $("npName").focus(); return; }
  var url = $("npUrl").value.trim();
  var r = await api("/api/qa?action=create-project", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: name, url: url }) });
  if (r.status !== 200) { setStatus(r.data.message || "Nu am putut crea proiectul."); return; }
  $("npName").value = ""; $("npUrl").value = "";
  $("newProj").hidden = true;
  $("newProjectBtn").hidden = false;
  await loadProjects(false);
  selectProject(r.data.project.id);
});

$("logout").addEventListener("click", async function () {
  await api("/api/auth?action=logout", { method: "POST" });
  location.href = "/";
});

$("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msg = $("loginMsg");
  msg.className = "gate-msg";
  msg.textContent = "Se verifică…";
  var controls = e.target.querySelectorAll("input,button");
  for (var i = 0; i < controls.length; i++) controls[i].disabled = true;
  var r = await api("/api/auth?action=login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ email: $("email").value.trim(), password: $("pw").value }),
  }).catch(function () { return { status: 0, data: {} }; });
  if (r.status === 200) { location.reload(); return; }
  for (var k = 0; k < controls.length; k++) controls[k].disabled = false;
  msg.className = "gate-msg bad";
  msg.textContent = r.data.message || "Autentificare eșuată.";
});

(async function boot() {
  var me = await api("/api/auth?action=me").catch(function () { return { data: {} }; });
  if (!me.data || !me.data.authenticated) return;

  $("who").textContent = me.data.email || "";
  $("gate").hidden = true;
  $("app").hidden = false;

  await loadProjects(true);
})();
</script>
</body>
</html>
