<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Raport QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#FBFAF6;
  --border:#DEDBD1; --border-strong:#C7C3B6;
  --ink:#1E2420; --ink-soft:#5B655F; --ink-faint:#8B948C;
  --accent:#2F6B58; --accent-ink:#FFFFFF; --accent-soft:#E1EEE7;
  --danger:#A8402A; --danger-soft:#F6DFD8;
  --ok:#2F6B58; --ok-soft:#E1EEE7;
  --fixed-c:#2A5EA6; --fixed-soft:#DEEAF8;
  --shadow:0 1px 2px rgba(30,36,32,.06),0 6px 18px rgba(30,36,32,.07);
  --font-display:'Archivo','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#171E1B; --surface-2:#1D2521;
  --border:#2B3531; --border-strong:#3A4642;
  --ink:#E7ECE8; --ink-soft:#A3ADA6; --ink-faint:#6E7873;
  --accent:#6FC8A8; --accent-ink:#0B1512; --accent-soft:#1D362E;
  --danger:#E38468; --danger-soft:#3A211A;
  --ok:#6FC8A8; --ok-soft:#1D362E;
  --fixed-c:#6C9DE4; --fixed-soft:#1B2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171E1B; --surface-2:#1D2521;
  --border:#2B3531; --border-strong:#3A4642;
  --ink:#E7ECE8; --ink-soft:#A3ADA6; --ink-faint:#6E7873;
  --accent:#6FC8A8; --accent-ink:#0B1512; --accent-soft:#1D362E;
  --danger:#E38468; --danger-soft:#3A211A;
  --ok:#6FC8A8; --ok-soft:#1D362E;
  --fixed-c:#6C9DE4; --fixed-soft:#1B2A3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--font-display);margin:0}
.wrap{max-width:720px;margin:0 auto;padding:36px 18px 70px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
h1{font-size:24px;letter-spacing:-.01em}
.purl{font-size:13px;color:var(--ink-soft);margin-top:6px;overflow-wrap:anywhere}
.updated{font-size:12.5px;color:var(--ink-faint);margin-top:4px}

.group{margin-top:28px}
.group h2{font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.bug{background:var(--danger)}
.dot.fixed{background:var(--fixed-c)}
.dot.ok{background:var(--ok)}
.count{font-size:12.5px;color:var(--ink-faint);font-weight:600}
.items{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.5;box-shadow:var(--shadow);overflow-wrap:anywhere}
.item.bug{border-left:3px solid var(--danger)}
.item.fixed{border-left:3px solid var(--fixed-c)}
.item.ok{border-left:3px solid var(--ok)}

.empty{margin-top:60px;text-align:center;color:var(--ink-faint)}
.foot{margin-top:44px;font-size:11.5px;color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <p class="eyebrow">Raport QA</p>
  <h1 id="rTitle">Se încarcă…</h1>
  <div id="rMeta"></div>
  <div id="rBody"></div>
</div>
<script>
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function group(list, status) {
  return list.filter(function (f) { return f.status === status; });
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString("ro-RO", { day: "numeric", month: "long", year: "numeric" }); }
  catch (e) { return ""; }
}
function renderGroup(host, label, dotClass, items) {
  if (!items.length) return;
  var sec = document.createElement("div");
  sec.className = "group";
  var h = document.createElement("h2");
  h.innerHTML = '<span class="dot ' + dotClass + '"></span>' + label + ' <span class="count">(' + items.length + ')</span>';
  sec.appendChild(h);
  var box = document.createElement("div");
  box.className = "items";
  items.forEach(function (f) {
    var it = document.createElement("div");
    it.className = "item " + dotClass;
    it.textContent = f.text;
    box.appendChild(it);
  });
  sec.appendChild(box);
  host.appendChild(sec);
}

(async function () {
  var slug = new URL(location.href).searchParams.get("p") || "";
  var r = await fetch("/api/qa-public?slug=" + encodeURIComponent(slug));
  var data = await r.json().catch(function () { return {}; });
  if (r.status !== 200) {
    document.getElementById("rTitle").textContent = "Raport indisponibil";
    var e = document.createElement("p");
    e.className = "empty";
    e.textContent = data.message || "Acest link nu este valid.";
    document.getElementById("wrap").appendChild(e);
    return;
  }
  document.getElementById("rTitle").textContent = data.name || "Raport";
  var meta = document.getElementById("rMeta");
  if (data.url) { var u = document.createElement("div"); u.className = "purl"; u.textContent = data.url; meta.appendChild(u); }
  var upd = document.createElement("div");
  upd.className = "updated";
  upd.textContent = "Actualizat " + fmtDate(data.updated_at);
  meta.appendChild(upd);

  var findings = data.findings || [];
  var body = document.getElementById("rBody");
  if (!findings.length) {
    var empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Nicio observație publicată încă.";
    body.appendChild(empty);
    return;
  }
  renderGroup(body, "Nu merge", "bug", group(findings, "bug"));
  renderGroup(body, "Rezolvat", "fixed", group(findings, "fixed"));
  renderGroup(body, "Merge", "ok", group(findings, "ok"));

  var foot = document.createElement("p");
  foot.className = "foot";
  foot.textContent = "Raport generat automat, actualizat live.";
  document.getElementById("wrap").appendChild(foot);
})();
</script>
</body>
</html>
